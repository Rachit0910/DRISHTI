<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="960" viewBox="0 0 1640 960" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#85929E"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#212F3D" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1640" height="960" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="50" y="62" font-size="34" font-weight="bold" fill="#6C3483">Drishti — On-Device Perception Pipeline</text>
  <text x="50" y="98" font-size="20" fill="#5D6D7E">Every inference stage executes on the Snapdragon Hexagon NPU. No network call anywhere in the loop.</text>
  <line x1="50" y1="122" x2="1590" y2="122" stroke="#E5E7E9" stroke-width="2"/>

  <!-- Column 1: Camera -->
  <rect x="50" y="370" width="200" height="120" rx="10" fill="#FFFFFF" stroke="#D5D8DC" stroke-width="2" filter="url(#soft)"/>
  <text x="150" y="413" font-size="20" font-weight="bold" fill="#212F3D" text-anchor="middle">Camera</text>
  <text x="150" y="441" font-size="16" fill="#5D6D7E" text-anchor="middle">Built-in webcam</text>
  <text x="150" y="465" font-size="16" fill="#5D6D7E" text-anchor="middle">30 fps stream</text>

  <line x1="258" y1="430" x2="300" y2="430" stroke="#85929E" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Column 2: Preprocess -->
  <rect x="310" y="370" width="200" height="120" rx="10" fill="#FFFFFF" stroke="#D5D8DC" stroke-width="2" filter="url(#soft)"/>
  <text x="410" y="405" font-size="20" font-weight="bold" fill="#212F3D" text-anchor="middle">Preprocess</text>
  <text x="410" y="432" font-size="16" fill="#5D6D7E" text-anchor="middle">Resize · normalize</text>
  <text x="410" y="455" font-size="16" fill="#5D6D7E" text-anchor="middle">Quality gate:</text>
  <text x="410" y="475" font-size="16" fill="#5D6D7E" text-anchor="middle">covered · dark · blurred</text>

  <line x1="518" y1="430" x2="560" y2="430" stroke="#85929E" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Column 3: NPU band -->
  <rect x="570" y="180" width="480" height="500" rx="14" fill="#F4ECF7" stroke="#6C3483" stroke-width="2.5"/>
  <text x="810" y="218" font-size="23" font-weight="bold" fill="#6C3483" text-anchor="middle">Hexagon NPU</text>
  <text x="810" y="243" font-size="16" fill="#6C3483" text-anchor="middle">ONNX Runtime · QNN Execution Provider</text>

  <!-- Model card 1 -->
  <rect x="600" y="258" width="420" height="112" rx="10" fill="#FFFFFF" stroke="#D5D8DC" stroke-width="2"/>
  <text x="620" y="291" font-size="19" font-weight="bold" fill="#212F3D">YOLOv8-Detection · w8a8</text>
  <text x="620" y="317" font-size="16" fill="#5D6D7E">Objects, people, obstacles · 640×640</text>
  <rect x="620" y="331" width="126" height="26" rx="13" fill="#D4EFDF"/>
  <text x="683" y="349" font-size="14" font-weight="bold" fill="#117A65" text-anchor="middle">EVERY FRAME</text>
  <text x="1000" y="349" font-size="17" font-weight="bold" fill="#6C3483" text-anchor="end">0.67 ms</text>

  <!-- Model card 2 -->
  <rect x="600" y="383" width="420" height="112" rx="10" fill="#FFFFFF" stroke="#D5D8DC" stroke-width="2"/>
  <text x="620" y="416" font-size="19" font-weight="bold" fill="#212F3D">Midas-V2 Depth · w8a8</text>
  <text x="620" y="442" font-size="16" fill="#5D6D7E">Monocular distance estimate · 256×256</text>
  <rect x="620" y="456" width="126" height="26" rx="13" fill="#D4EFDF"/>
  <text x="683" y="474" font-size="14" font-weight="bold" fill="#117A65" text-anchor="middle">EVERY FRAME</text>
  <text x="1000" y="474" font-size="17" font-weight="bold" fill="#6C3483" text-anchor="end">0.62 ms</text>

  <!-- Model card 3 -->
  <rect x="600" y="508" width="420" height="112" rx="10" fill="#FFFFFF" stroke="#D5D8DC" stroke-width="2"/>
  <text x="620" y="541" font-size="19" font-weight="bold" fill="#212F3D">EasyOCR · detector + recognizer</text>
  <text x="620" y="567" font-size="16" fill="#5D6D7E">Signs, labels, printed text · 608×800</text>
  <rect x="620" y="581" width="118" height="26" rx="13" fill="#FDEBD0"/>
  <text x="679" y="599" font-size="14" font-weight="bold" fill="#B9770E" text-anchor="middle">ON DEMAND</text>
  <text x="1000" y="599" font-size="17" font-weight="bold" fill="#6C3483" text-anchor="end">32.8 ms</text>

  <text x="810" y="653" font-size="14" fill="#5D6D7E" text-anchor="middle">AI Hub published figures · Snapdragon X2 Elite</text>

  <line x1="1058" y1="430" x2="1100" y2="430" stroke="#85929E" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Column 4: Policy engine -->
  <rect x="1110" y="342" width="230" height="176" rx="10" fill="#FFFFFF" stroke="#6C3483" stroke-width="2.5" filter="url(#soft)"/>
  <text x="1225" y="387" font-size="19" font-weight="bold" fill="#212F3D" text-anchor="middle">Salience &amp;</text>
  <text x="1225" y="411" font-size="19" font-weight="bold" fill="#212F3D" text-anchor="middle">Narration Policy</text>
  <text x="1225" y="437" font-size="15" fill="#5D6D7E" text-anchor="middle">Hazard ranking</text>
  <text x="1225" y="459" font-size="15" fill="#5D6D7E" text-anchor="middle">Novelty suppression</text>
  <text x="1225" y="481" font-size="15" fill="#5D6D7E" text-anchor="middle">Utterance budgeting</text>
  <text x="1225" y="503" font-size="15" fill="#5D6D7E" text-anchor="middle">Localised phrasebook</text>

  <line x1="1348" y1="430" x2="1390" y2="430" stroke="#85929E" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Column 5: TTS -->
  <rect x="1400" y="370" width="190" height="120" rx="10" fill="#FFFFFF" stroke="#D5D8DC" stroke-width="2" filter="url(#soft)"/>
  <text x="1495" y="413" font-size="20" font-weight="bold" fill="#212F3D" text-anchor="middle">Offline TTS</text>
  <text x="1495" y="441" font-size="16" fill="#5D6D7E" text-anchor="middle">Windows SAPI</text>
  <text x="1495" y="465" font-size="16" fill="#5D6D7E" text-anchor="middle">en · hi voices</text>

  <!-- Fallback lane -->
  <rect x="50" y="710" width="1540" height="86" rx="10" fill="#FBFCFC" stroke="#D5D8DC" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="76" y="746" font-size="18" font-weight="bold" fill="#212F3D">Execution fallback</text>
  <text x="76" y="775" font-size="17" fill="#5D6D7E">QNN EP (Hexagon NPU)  →  DirectML (Adreno GPU)  →  CPU EP     ·     identical model artifacts, graceful degradation, no rebuild</text>

  <!-- Frame budget callout -->
  <rect x="50" y="820" width="1540" height="94" rx="10" fill="#F4ECF7" stroke="#6C3483" stroke-width="2"/>
  <text x="76" y="856" font-size="18" font-weight="bold" fill="#6C3483">Frame budget at 30 fps = 33.3 ms</text>
  <text x="76" y="886" font-size="17" fill="#212F3D">Tier A (detection + depth) = 1.29 ms → 3.9% of budget     ·     Tier B (OCR) amortized at 2 Hz ≈ 2.2 ms/frame     ·     steady state ≈ 10% of budget</text>
  <text x="76" y="943" font-size="14" fill="#85929E">Latencies are Qualcomm AI Hub published model-inference figures on Snapdragon X2 Elite; end-to-end pipeline latency additionally includes capture, pre/post-processing and NMS.</text>
</svg>
